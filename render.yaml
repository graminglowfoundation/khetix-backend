services:
  - type: web
    name: khetix-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: LOG_LEVEL
        value: info
      - key: DISABLE_CLUSTER
        # Prevents Node.js from forking multiple workers on Render free tier.
        # Without this, cluster.fork() creates 4-8 processes × ~100MB = OOM.
        value: "true"
      - key: NODE_OPTIONS
        # Hard-caps Node heap to 400MB, leaving ~100MB for OS + native libs.
        # Prevents silent OOM kills that Render reports as "memory exceeded".
        value: --max-old-space-size=400
      - key: API_BASE_URL
        sync: false